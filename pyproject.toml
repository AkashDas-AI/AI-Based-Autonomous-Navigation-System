[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-nav"
version = "0.1.0"
description = "Simulation-first AI-Based Autonomous Navigation System with 2D occupancy grid mapping, A* planning, and kinematic motion control"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Autonomous Systems Team" }
]
keywords = [
    "autonomous-navigation",
    "path-planning",
    "occupancy-grid",
    "astar",
    "robotics",
    "simulation",
    "pure-pursuit"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "opencv-python>=4.8.0",
    "pygame>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]
perception = [
    "opencv-python>=4.8.0"
]
interactive = [
    "pygame>=2.5.0"
]

[project.scripts]
autonomous-nav = "autonomous_nav.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "scenario: marks closed-loop scenario benchmark tests"
]

